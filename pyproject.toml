[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skywalker-astro"
version = "2.0.0b1"
description = "Plan and visualize altitude/azimuth tracks of astronomical objects for observers at any observatory on Earth."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Herpich F. R." }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.9"
dependencies = [
    "astropy",
    "matplotlib",
    "pandas",
    "timezonefinder",
    "pytz",
    "numpy",
    "pyqt5",
    "astroplan @ git+https://github.com/herpichfr/astroplan.git@master",
]

[project.optional-dependencies]
html = ["plotly>=5.15"]
web = ["plotly>=5.15", "dash>=2.14,<5"]

[project.urls]
Homepage = "https://github.com/herpichfr/skywalker"

[project.scripts]
skywalker = "skywalker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skywalker = ["assets/*.css"]
